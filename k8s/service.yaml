apiVersion: v1
kind: Service
metadata:
  name: casino-backend
  labels:
    app: casino-backend
spec:
  type: ClusterIP            # Solo accesible desde dentro del clúster
  selector:
    app: casino-backend
  ports:
    - name: http
      protocol: TCP
      port: 3000             # El DNS interno responderá en este puerto
      targetPort: 3000
